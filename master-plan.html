<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Master Plan | IFFCO Kisan SEZ</title>
<meta name="description" content="The IFFCO Kisan SEZ master plan — layout of the Multiproduct SEZ and Domestic Tariff Area at SPSR Nellore, Andhra Pradesh.">
<link rel="icon" href="images/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/theme.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/components.css">
</head>
<body>

<a class="skip-link" href="#main">Skip to content</a>

<div data-include="components/header.html"></div>

<main id="main">

  <div data-include="components/page-hero.html"
       data-title="Master Plan"
       data-subtitle="Click the plan to view it full size."
       data-banner="images/master-plan-banner.png"></div>

  <section class="section">
    <div class="container">
      <figure style="margin:0" data-reveal>
        <a href="images/map-iksez.png" data-lightbox data-caption="IFFCO Kisan SEZ — Master Plan"
           style="display:block;border-radius:var(--radius-lg);overflow:hidden;border:1px solid var(--color-border);box-shadow:var(--shadow)">
          <img src="images/map-iksez.png" alt="IFFCO Kisan SEZ master plan" loading="lazy" style="width:100%">
        </a>
        <figcaption class="figure-caption">IFFCO Kisan SEZ &mdash; Master Plan</figcaption>
      </figure>

      <div class="flex mt-8" style="justify-content:center" data-reveal>
        <a class="btn btn--brand" href="#">Download Master Plan</a>
        <a class="btn btn--outline" href="contact-us.html">Request a site visit</a>
      </div>
    </div>
  </section>

  <section class="section section--tight section--alt">
    <div class="container">
      <div class="stats" data-reveal>
        <div class="stat">
          <div class="stat__value"><span data-count="1900">1,900</span></div>
          <p class="stat__label">Acres of Multiproduct Special Economic Zone</p>
        </div>
        <div class="stat">
          <div class="stat__value"><span data-count="877">877</span></div>
          <p class="stat__label">Acres of Domestic Tariff Area (DTA)</p>
        </div>
        <div class="stat">
          <div class="stat__value"><span data-count="2776.23">2,776.23</span></div>
          <p class="stat__label">Total acres under development at SPSR Nellore</p>
        </div>
        <div class="stat">
          <div class="stat__value"><span data-count="27">27</span> km</div>
          <p class="stat__label">Boundary wall securing the site</p>
        </div>
      </div>
    </div>
  </section>

  <div data-include="components/cta-band.html"></div>

</main>

<div data-include="components/footer.html"></div>

<script src="assets/js/include.js"></script>
<script src="assets/js/main.js"></script>
</body>
</html>
