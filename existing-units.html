<a class="skip-link" href="#main">Skip to content</a>

<div data-include="components/header.html"></div>

<main id="main">

  <div data-include="components/page-hero.html"
       data-title="Existing units"
       data-subtitle="Many other companies of National repute are also expected to set up their units very soon."
       data-banner="images/infrastructur-banner.png"></div>

  <section class="section">
    <div class="container">
      <div class="section-head" data-reveal>
        <span class="eyebrow">Operating at IKSEZ</span>
        <h2>Companies on site</h2>
      </div>

      <div class="grid grid--4">
        <article class="card" data-reveal>
          <div class="card__icon"><svg viewBox="0 0 24 24"><path d="M12 2v6M12 12l7 4M12 12l-7 4"/><circle cx="12" cy="10" r="2.2"/></svg></div>
          <h4 style="font-size:var(--fs-base)">Siemens Gamesa Renewable Energy Pvt Ltd</h4>
        </article>
        <article class="card" data-reveal>
          <div class="card__icon"><svg viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="12" rx="2"/><path d="M8 8V6a4 4 0 0 1 8 0v2"/></svg></div>
          <h4 style="font-size:var(--fs-base)">ADJ</h4>
        </article>
        <article class="card" data-reveal>
          <div class="card__icon"><svg viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7l1-8z"/></svg></div>
          <h4 style="font-size:var(--fs-base)">APTRANSCO</h4>
        </article>
        <article class="card" data-reveal>
          <div class="card__icon"><svg viewBox="0 0 24 24"><path d="M8 2h8l-1 4H9L8 2zM7 6h10l1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L7 6z"/></svg></div>
          <h4 style="font-size:var(--fs-base)">HCCB <span class="muted" style="font-weight:500">(coming up)</span></h4>
        </article>
      </div>
    </div>
  </section>

  <section class="section section--alt">
    <div class="container">
      <div class="section-head" data-reveal>
        <span class="eyebrow">On site</span>
        <h2>From the units</h2>
      </div>

      <div class="grid grid--2">
        <article class="media-card" data-reveal>
          <a class="media-card__figure" href="images/existing-1.jpg" data-lightbox data-caption="Wind mill blade of Siemen&rsquo;s Gamesa being transported">
            <img src="images/existing-1.jpg" alt="Wind mill blade of Siemen&rsquo;s Gamesa being transported" loading="lazy">
          </a>
          <div class="media-card__body"><h4>Wind mill blade of Siemen&rsquo;s Gamesa being transported</h4></div>
        </article>

        <article class="media-card" data-reveal>
          <a class="media-card__figure" href="images/existing-2.png" data-lightbox data-caption="An export consignments of ADJ &amp; Brothers">
            <img src="images/existing-2.png" alt="An export consignments of ADJ &amp; Brothers" loading="lazy">
          </a>
          <div class="media-card__body"><h4>An export consignments of ADJ &amp; Brothers</h4></div>
        </article>
      </div>
    </div>
