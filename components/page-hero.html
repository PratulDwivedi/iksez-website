<!-- ============================================================
     COMPONENT: Inner page banner with breadcrumb
     Usage:
       <div data-include="components/page-hero.html"
            data-title="About us"
            data-subtitle="Optional one-line intro"
            data-banner="images/about-us-banner.png"></div>
     data-subtitle is optional — omit it and the paragraph is removed.
     ============================================================ -->
<section class="page-hero">
  <div class="page-hero__bg" style="background-image:url('{{banner}}')"></div>
  <div class="container">
    <ol class="breadcrumb">
      <li><a href="index.html">Home</a></li>
      <li><span aria-current="page">{{title}}</span></li>
    </ol>
    <h1>{{title}}</h1>
    <p data-if="subtitle">{{subtitle}}</p>
  </div>
</section>
